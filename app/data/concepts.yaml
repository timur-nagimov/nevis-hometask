  expands_to: [utility bill, council tax bill, gas bill, electricity bill, water bill, bank statement, mortgage statement, tenancy agreement, driving licence, hmrc tax notification]
  sources:
    - "https://www.gov.uk/jobseekers-allowance/your-jsa-interview"
    - "https://www.gov.uk/government/publications/proof-of-identity-checklist/proof-of-identity-checklist"
