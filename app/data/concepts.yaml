# Concept map: relations of the form "document X is accepted as evidence of / belongs to Y".
# `concept` is the tag, `triggers` are the ways people ask for it, and `expands_to` lists the documents that
# are evidence of it or belong to it.
# At upload, a document whose title or text contains the concept name or an expands_to phrase gets the concept
# as a tag, and the concept with its triggers goes into the document's searchable tag text. Phrases match
# stemmed and without punctuation; a phrase that starts or ends with a stop word ("in", "will") never matches.
# A language model drafted the map from general domain knowledge (UK-centric wealth management); `sources`
# names official lists that state a relation and is not used for matching.
- concept: proof of identity
  triggers: [proof of identity, proof of id, identity proof, evidence of identity, identity document, photo id, identity verification, electronic identity check]
  expands_to: [passport, driving licence, national identity card, biometric residence permit, photocard driving licence, driver's license, residence permit, state id card, electronic verification report, identity check result]
  sources:
    - "https://www.gov.uk/government/publications/proof-of-identity-checklist/proof-of-identity-checklist"
    - "https://www.gov.uk/government/publications/dbs-identity-checking-guidelines/id-checking-guidelines-for-standardenhanced-dbs-check-applications-from-22-april-2025"
- concept: proof of address
