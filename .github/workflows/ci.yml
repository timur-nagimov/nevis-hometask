# CI, two jobs in parallel. build-and-test: build both images, start the stack, wait for /health, run every
# test in the tests container. demo: start the stack, run the demo twice (the second run must create nothing)
# and check both assignment examples. Each job shows the logs when something failed and removes everything.
# ubuntu-latest is x86_64, so this is also the linux/amd64 check of the image.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build the api and tests images
        timeout-minutes: 15
        run: docker compose --profile test build

      - name: Lint and type-check inside the tests image
        run: >-
          docker compose --profile test run --rm --no-deps -T tests
          sh -c "ruff check --no-cache . && ruff format --no-cache --check . && mypy --cache-dir=/dev/null"

      - name: Start the database and the API
        run: docker compose up -d

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "the API did not answer /health within 120 s"
          exit 1

      - name: Run all tests (unit and integration) in the tests container
        timeout-minutes: 10
        run: docker compose --profile test run --rm --no-deps -T tests

      - name: Show the containers and their logs
        if: failure() || cancelled()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop and remove the containers and the database volume
        if: always()
        run: docker compose down -v

  demo:
    name: demo (both assignment examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build and start the stack
        timeout-minutes: 15
        run: docker compose up --build -d

      - name: Run the demo twice; the second run must create nothing
        run: |
          set -o pipefail  # the default shell has no pipefail: tee would hide a failed second run
          scripts/demo.sh
          scripts/demo.sh | tee second-run.txt
          grep -q "already exists" second-run.txt

      - name: Check both examples and that nothing was duplicated
        run: python3 scripts/check_demo.py

      - name: Show the containers and their logs
        if: failure() || cancelled()
        run: |
          docker compose ps -a
          docker compose logs --no-color

      - name: Stop and remove the containers and the database volume
        if: always()
        run: docker compose down -v
