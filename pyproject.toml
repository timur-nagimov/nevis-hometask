[project]
name = "nevis-search"
version = "0.1.0"
description = "Search API over clients and their documents"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "email-validator==2.4.0",
    "psycopg[binary]==3.3.9",
    "sqlalchemy==2.1.9",
    "pgvector==0.5.1",
    "onnxruntime==1.32.0",
    "tokenizers==0.23.3",
    "numpy==2.5.5",
    "pyyaml==6.0.3",
    "anthropic==2.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.2",  # required by fastapi.testclient (Starlette >= 1.x prefers httpx2)
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261122",
]

[tool.uv]
package = false  # an application, not a library: nothing to build; code is imported from the repo root
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.ruff]
line-length = 110
target-version = "py314"
# Local material outside the repository; the test set's own files, kept as they are; and *.md, because
# ruff 0.17 also formats the Python blocks inside Markdown files, whose snippets are often partial on purpose.
extend-exclude = ["research", "testset", "*.md"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001", "RUF002", "RUF003"]  # Cyrillic and accented test data is deliberate

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "eval", "tests"]
explicit_package_bases = true  # tests/ has no __init__.py; the repository root is the base
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]  # ships no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["testset.*"]  # the test set's own scripts, imported as they are; not written for strict mode
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No -q here: a -q on the command line would add up to -qq, and pytest then prints no "N passed" line.
addopts = "--import-mode=importlib -m 'not slow'"
markers = ["slow: the latency measurement during parallel uploads; deselected unless -m slow is given"]
filterwarnings = ["error"]
